<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marathon roads">
<meta name="theme-color" content="#f2f2f0">
<title>Marathon The Hague road closures</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/overpass-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
<script src="vendor/pmtiles.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div id="map"><p id="loading">Loading the offline map</p></div>
<time id="clock"></time>
<section id="sheet" class="collapsed" aria-label="Road closures">
  <button id="handle" aria-expanded="false" aria-controls="details">
    <span class="grip"></span>
    <strong id="summary"></strong>
    <span id="next"></span>
  </button>
  <div id="details">
    <div class="legend">
      <span class="tape"></span><span>closed</span>
      <span class="ramp"></span><span>open, closes in 0m to 4h</span>
      <span class="gone"></span><span>reopened</span>
      <span class="other"></span><span>10K and 5K</span>
    </div>
    <ol id="rows"></ol>
    <p class="note">Sunday 1 November 2026. Times from the official closure map are indicative: a road can close earlier or reopen later.</p>
  </div>
</section>
<button id="update" hidden>New version ready. Tap to update.</button>
</body>
</html>
